name: Vibeio native tests

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "All-feature test repetitions per native platform"
        type: choice
        default: "3"
        options: ["1", "3", "10"]
      isolated_features:
        description: "Also lint and test each feature independently"
        type: boolean
        default: true
  workflow_call:
    inputs:
      repetitions:
        type: string
        default: "1"
      isolated_features:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native:
    name: vibeio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: never
      REPETITIONS: ${{ inputs.repetitions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache runtime harness build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/vibeio-check

      - name: Record native environment
        run: |
          mkdir -p target/vibeio-native-logs
          case "$REPETITIONS" in
            1|3|10) ;;
            *) echo "Unsupported repetition count: $REPETITIONS"; exit 1 ;;
          esac
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -a
          } 2>&1 | tee target/vibeio-native-logs/environment.log

      - name: Check formatting and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --manifest-path tools/vibeio-check/Cargo.toml --all -- --check
          cargo doc --manifest-path tools/vibeio-check/Cargo.toml --all-features --no-deps --locked 2>&1 | tee target/vibeio-native-logs/documentation.log

      - name: Lint native all-feature build
        run: cargo clippy --manifest-path tools/vibeio-check/Cargo.toml --all-targets --all-features --locked -- -D warnings 2>&1 | tee target/vibeio-native-logs/clippy.log

      - name: Inventory native tests
        run: cargo test --manifest-path tools/vibeio-check/Cargo.toml --all-features --locked -- --list 2>&1 | tee target/vibeio-native-logs/test-inventory.log

      - name: Run native all-feature tests repeatedly
        run: |
          for ((iteration=1; iteration<=REPETITIONS; iteration++)); do
            cargo test --manifest-path tools/vibeio-check/Cargo.toml --all-features --locked -- --nocapture 2>&1 | tee "target/vibeio-native-logs/all-features-${iteration}.log"
          done

      - name: Check isolated features
        if: ${{ inputs.isolated_features }}
        run: |
          for feature in '' fs process signal pipe stdio splice blocking-default; do
            label="${feature:-default}"
            cargo clippy --manifest-path tools/vibeio-check/Cargo.toml --all-targets --no-default-features --features "$feature" --locked -- -D warnings 2>&1 | tee "target/vibeio-native-logs/clippy-${label}.log"
            cargo test --manifest-path tools/vibeio-check/Cargo.toml --no-default-features --features "$feature" --locked -- --nocapture 2>&1 | tee "target/vibeio-native-logs/tests-${label}.log"
          done

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeio-native-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/vibeio-native-logs/
          if-no-files-found: warn
          retention-days: 14
