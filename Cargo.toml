[package]
name = "rsloop"
version = "0.1.47"
edition = "2024"
description = "An event loop for asyncio written in Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RustedBytes/rsloop"
homepage = "https://github.com/RustedBytes/rsloop"
documentation = "https://github.com/RustedBytes/rsloop#readme"

[lib]
name = "rsloop"
crate-type = ["cdylib", "rlib"]

[features]
default = []
profiler = ["dep:tracy-client", "dep:tracy-client-sys"]

[dependencies]
async-io = "2"
async-std = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-util = "0.3"
libc = "0.2"
memchr = "2"
mio = "1"
oneshot = { version = "0.2", features = ["async", "std"] }
pyo3 = { version = "0.29.2" }
pyo3-async-runtimes = { version = "0.29", features = ["async-std-runtime"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
signal-hook = "0.4"
slab = "0.4"
socket2 = "0.6"
tokio = { version = "1", default-features = false, features = ["io-util"] }
tracy-client = { version = "0.19", default-features = false, features = ["enable", "only-localhost", "sampling"], optional = true }
# tracy-client 0.19 accepts older sys releases whose generated API is
# incompatible with the wrapper. Keep the matching bindings selected.
tracy-client-sys = { version = "=0.30.0", default-features = false, optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
pyo3-build-config = "0.29.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# PyO3 callbacks and cross-thread workers intentionally transfer owned values.
needless_pass_by_value = "allow"
# Python protocol methods must keep their receiver and awaitable/Result shapes.
unused_self = "allow"
unused_async = "allow"
unnecessary_wraps = "allow"
# These internal types are public for PyO3 registration and compatibility
# re-exports, rather than being a separately documented Rust API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Explicit lifetimes and descriptive names make the Python/Rust boundary easier
# to audit than the shorter forms suggested by these style-only lints.
elidable_lifetime_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
# Keep established control-flow and formatting where the pedantic alternative
# is preference-only and would obscure diffs in hot transport code.
explicit_deref_methods = "allow"
if_not_else = "allow"
manual_is_variant_and = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
needless_continue = "allow"
option_as_ref_cloned = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
single_match_else = "allow"
uninlined_format_args = "allow"
# FFI sites retain explicit pointer casts alongside their safety invariants.
borrow_as_ptr = "allow"
ref_as_ptr = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(musl_v1_2_3)", "cfg(syscall_accept4)", "cfg(syscall_pipe2)", "cfg(feature, values(\"blocking-default\", \"fs\", \"pipe\", \"process\", \"signal\", \"splice\", \"stdio\"))"] }

[package.metadata.kani.flags]
# Force every proof that reaches a loop to state and review its own bound.
default-unwind = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# strip = true

[profile.bench]
inherits = "release"
