[package]
name = "rsloop"
version = "0.1.49"
edition = "2024"
description = "An event loop for asyncio written in Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RustedBytes/rsloop"
homepage = "https://github.com/RustedBytes/rsloop"
documentation = "https://github.com/RustedBytes/rsloop#readme"

[lib]
name = "rsloop"
crate-type = ["cdylib", "rlib"]

[features]
default = []
profiler = ["dep:tracy-client", "dep:tracy-client-sys"]
# Embedded-runtime modules are opt-in; production wheels retain the default
# networking/timer build unless a feature is explicitly requested.
fs = []
process = ["dep:async-channel"]
signal = ["dep:once_cell", "dep:errno"]
pipe = []
stdio = []
splice = []
blocking-default = ["dep:rusty_pool"]

[dependencies]
errno = { version = "0.3", optional = true }
async-channel = { version = "2", optional = true }
async-io = "2"
async-std = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-util = "0.3"
libc = "0.2"
memchr = "2"
mio = "1"
oneshot = { version = "0.2", features = ["async", "std"] }
pin-project-lite = "0.2"
once_cell = { version = "1", optional = true }
pyo3 = { version = "0.29.2" }
pyo3-async-runtimes = { version = "0.29", features = ["async-std-runtime"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rusty_pool = { version = "0.7", default-features = false, optional = true }
signal-hook = "0.4"
slab = "0.4"
socket2 = "0.6"
tokio = { version = "1", default-features = false, features = ["io-util"] }
tracy-client = { version = "0.19", default-features = false, features = ["enable", "only-localhost", "sampling"], optional = true }
# tracy-client 0.19 accepts older sys releases whose generated API is
# incompatible with the wrapper. Keep the matching bindings selected.
tracy-client-sys = { version = "=0.30.0", default-features = false, optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
pyo3-build-config = "0.29.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.clippy]
# Enforce bug, concurrency, and performance checks rather than style preferences.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Keep safety checks even when they belong to an otherwise disabled group.
missing_safety_doc = "warn"
cast_ptr_alignment = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(musl_v1_2_3)", "cfg(syscall_accept4)", "cfg(feature, values(\"blocking-default\", \"fs\", \"pipe\", \"process\", \"signal\", \"splice\", \"stdio\"))"] }

[package.metadata.kani.flags]
# Force every proof that reaches a loop to state and review its own bound.
default-unwind = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "timer"
harness = false
