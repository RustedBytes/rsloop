[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "rsloop"
version = "0.1.48"
description = "An event loop for asyncio written in Rust"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Yehor Smoliakov <egorsmkv@gmail.com>" },
]
keywords = ["asyncio", "event-loop", "pyo3", "python", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/RustedBytes/rsloop"
Repository = "https://github.com/RustedBytes/rsloop"
Issues = "https://github.com/RustedBytes/rsloop/issues"

[tool.maturin]
python-source = "python"
module-name = "rsloop._loop"
include = ["python/rsloop/_loop.pyi"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "mkdocs>=1.6.1",
    "pyright>=1.1.400",
    "ruff>=0.15.19",
    "rust-just>=1.54.0",
    "typing-extensions>=4.0",
    { include-group = "test" },
    { include-group = "integration" },
]
# Core unittest dependencies, including on free-threaded Python.
test = [
    "typing-extensions>=4.0",
    "websockets>=13.0",
]
# Optional library/framework scripts in tests/packages. Native dependencies
# here may not support every interpreter in the core test matrix.
integration = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.20.0",
    "anyio>=4.14.2",
    "beanie>=2.0.0",
    "daphne>=4.2.3",
    "django>=5.2.17",
    "edgy>=0.30.0",
    "falcon>=4.1.0",
    "fastapi>=0.124.4",
    "faststream[nats]>=0.5.48",
    "granian>=1.6.4",
    "hypercorn>=0.17.3",
    "litestar>=2.24.0",
    "mangum>=0.21.0",
    "ormar>=0.22.0",
    "piccolo>=1.30.0",
    "quart>=0.19.9",
    "sanic>=23.12.1,<24; python_version < '3.10'",
    "sanic>=25.3.0; python_version >= '3.10'",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.24",
    "starlette>=0.44.0",
    "tortoise-orm>=1.0.0",
    "uvicorn>=0.33.0",
]
