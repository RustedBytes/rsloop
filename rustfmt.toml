# 1. Required to enable any of the powerful reordering features below
unstable_features = true

# 2. Automatically converts #[doc = "..."] blocks back into clean `///` comments
normalize_doc_attributes = true

# 3. Formats the markdown code blocks inside your doc comments!
format_code_in_doc_comments = true

# 4. Breaks up or wraps overly long comment lines to fit neatly on screen
wrap_comments = true
comment_width = 80

# Enhanced Cleanliness & 2024 Targets

# Controls the formatting rules to use (RFC 3338 Style Editions)
style_edition = "2024"

# Modern settings for managing imports neatly (avoids giant messy trees)
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Tidies up structures and parameters
use_field_init_shorthand = true
condense_wildcard_suffixes = true

# Upgrades standard internal formatting strategies
version = "Two"
